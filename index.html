<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raman AI Labs | Excellence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --oceanic: #48CAE4;
            --deep-black: #050608;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        /* Essential Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--deep-black);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* High-Performance Background Orbs */
        .orb {
            position: fixed; border-radius: 50%; z-index: -1; pointer-events: none;
            background: radial-gradient(circle, rgba(72, 202, 228, 0.1) 0%, transparent 70%);
        }

        /* Responsive Navigation */
        header {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            padding: 30px 6%; position: relative; z-index: 100; gap: 20px;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-box {
            width: 38px; height: 38px; 
            background: linear-gradient(135deg, #0077B6, #48CAE4);
            border-radius: 8px; display: flex; align-items: center; 
            justify-content: center; font-weight: 800; color: #000; font-size: 20px;
        }

        nav { display: flex; align-items: center; gap: 20px; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }
        nav::-webkit-scrollbar { display: none; } /* Hide mobile scrollbar for clean look */

        nav a { 
            text-decoration: none; color: #666; font-size: 13px; 
            white-space: nowrap; transition: 0.3s;
        }
        nav a.active { color: #fff; display: flex; align-items: center; gap: 6px; }
        nav a.active i { color: var(--oceanic); font-size: 8px; }
        
        /* Layout Grid */
        main {
            display: flex; flex-direction: column;
            padding: 0 6% 100px 6%; gap: 40px; margin-top: 20px;
        }

        /* Text Scaling for Mobile vs Laptop */
        .hero-text {
            font-size: clamp(32px, 8vw, 68px); /* Fluid typography */
            font-weight: 700; line-height: 1.1;
            letter-spacing: -1.5px; margin-bottom: 30px;
        }
        .hero-text span { color: var(--oceanic); }

        .btn-group { display: flex; gap: 12px; margin-bottom: 50px; }
        .btn-main {
            padding: 12px 28px; border-radius: 50px; border: none;
            font-weight: 700; cursor: pointer; font-size: 13px;
        }
        .btn-primary { background: var(--oceanic); color: #000; }
        .btn-secondary { background: transparent; border: 1px solid #333; color: #999; }

        /* Dashed Grid Adjustments */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; 
        }
        .dashed-box {
            border: 1px dashed rgba(255,255,255,0.1); border-radius: 18px;
            height: 160px; background: rgba(255,255,255,0.01);
        }

        /* Floating Sidebar: Desktop vs Mobile */
        .research-panel {
            background: rgba(15, 18, 22, 0.98);
            border: 1px solid var(--border);
            border-radius: 24px; overflow: hidden;
            width: 100%; max-width: 340px;
        }
        .panel-header {
            padding: 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
            font-size: 11px; font-weight: 800; color: #888;
        }
        .panel-link {
            padding: 16px 20px; display: flex; align-items: center; gap: 12px;
            color: #999; text-decoration: none; font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .panel-link.active { color: var(--oceanic); }

        /* Touch Sensation Engine */
        .touch-point { transition: transform 0.1s ease; cursor: pointer; }
        .touch-point:active { transform: scale(0.95); filter: brightness(1.2); }

        /* Laptop Layout Overrides */
        @media (min-width: 1024px) {
            main { flex-direction: row; align-items: flex-start; }
            .content-section { flex: 1.4; }
            .sidebar-section { flex: 1; display: flex; justify-content: flex-end; }
        }

        /* Branding background text */
        .bg-branding {
            position: fixed; bottom: -20px; left: 5%; font-size: 15vw;
            font-weight: 900; opacity: 0.02; z-index: -2; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="orb" style="top: -5%; left: 5%; width: 50vw; height: 50vw;"></div>
    <div class="orb" style="bottom: -10%; right: 5%; width: 60vw; height: 60vw;"></div>

    <header>
        <div class="logo-area">
            <div class="logo-box">R</div>
            <div style="font-weight: 800; font-size: 18px;">Raman <span style="color: #444; font-weight: 400;">AI|</span>Labs</div>
        </div>
        <nav>
            <a href="#" class="active touch-point"><i class="fa-solid fa-circle-chevron-right"></i> Projects</a>
            <a href="#" class="touch-point">Articles</a>
            <a href="#" class="touch-point">Articles</a>
            <a href="#" style="color: var(--oceanic); font-weight: 700;" class="touch-point">Blogs</a>
            <a href="#" class="touch-point">Blogs</a>
            <button class="bg-[#1B4332] text-white px-5 py-2 rounded-full text-[11px] font-bold touch-point border-none">Connect Me</button>
        </nav>
    </header>

    <main>
        <div class="content-section">
            <h1 class="hero-text">
                Explore the deep oceanic depths of artificial intelligence <br>
                <span>never before ever after.</span>
            </h1>

            <div class="btn-group">
                <button class="btn-main btn-primary touch-point" onclick="authAdmin()">Admin Toggle</button>
                <button class="btn-main btn-secondary touch-point">Connect Me</button>
            </div>

            <div class="grid-container" id="projectGrid">
                <div class="dashed-box"></div>
                <div class="dashed-box"></div>
                <div class="dashed-box"></div>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="research-panel">
                <div class="panel-header">
                    <div style="width: 16px; height: 16px; background: var(--oceanic); border-radius: 4px; color: #000; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 900;">R</div>
                    RAMAN AI LABS
                </div>
                <div class="panel-body">
                    <a href="#" class="panel-link active touch-point"><i class="fa-solid fa-microscope"></i> Neural Research</a>
                    <a href="#" class="panel-link touch-point"><i class="fa-solid fa-dna"></i> Bio-Intelligence</a>
                    <a href="#" class="panel-link touch-point"><i class="fa-solid fa-terminal"></i> Autonomous Systems</a>
                    <a href="https://linkedin.com" class="panel-link touch-point"><i class="fa-brands fa-linkedin-in"></i> LinkedIn Official</a>
                    <a href="mailto:nikhilraman1203@gmail.com" class="panel-link touch-point" style="background: rgba(72, 202, 228, 0.08); color: var(--oceanic); font-weight: 700;">
                        <i class="fa-solid fa-anchor"></i> Connect Me
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div class="bg-branding">RAMAN</div>

    <script>
        // Haptic Feedback for Touch
        function triggerTouch() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        document.querySelectorAll('.touch-point').forEach(btn => {
            btn.addEventListener('click', triggerTouch);
        });

        // Backend Admin Logic
        function authAdmin() {
            const pass = prompt("Verify Identity (Research Code):");
            if(pass === "never before ever after") {
                const title = prompt("Entry Title:");
                const content = prompt("Brief Insight:");
                if(title && content) {
                    const grid = document.getElementById('projectGrid');
                    if(grid.querySelector('.dashed-box')) grid.innerHTML = "";
                    
                    const entry = document.createElement('div');
                    entry.style.cssText = "background: var(--glass); border: 1px solid var(--border); padding: 20px; border-radius: 18px;";
                    entry.innerHTML = `<h3 style='color:var(--oceanic);font-size:15px;margin-bottom:8px'># ${title}</h3><p style='color:#666;font-size:12px'>${content}</p>`;
                    grid.appendChild(entry);
                }
            } else {
                alert("Unauthorized Entry Attempt.");
            }
        }
    </script>
</body>
</html>
