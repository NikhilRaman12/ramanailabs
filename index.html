
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raman AI Labs | Unbeatable Global AI Interface</title>
    
    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              obsidian: '#0A0C10',
              oceanic: '#48CAE4',
              tealAccent: '#2BC6D1',
              labDark: '#111418',
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #0A0C10;
        color: white;
        margin: 0;
        overflow-x: hidden;
      }
      /* Premium Background Orbs (Planet Style) */
      .orb {
        position: fixed;
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
      }
      .orb-top-left {
        top: -150px;
        left: -150px;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle at center, #48CAE433 0%, #48CAE411 40%, transparent 75%);
        filter: blur(80px);
      }
      .orb-bottom-right {
        bottom: -200px;
        right: -100px;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle at center, #00B4D822 0%, #00B4D808 50%, transparent 80%);
        filter: blur(100px);
      }
      /* Glassmorphism Sidebar */
      .sidebar-panel {
        background: rgba(18, 22, 28, 0.9);
        backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
      }
      /* Vertical Dashed Containers */
      .dashed-box {
        border: 1px dashed rgba(255, 255, 255, 0.1);
        height: 520px;
        border-radius: 4px;
        transition: all 0.4s ease;
      }
      .dashed-box:hover {
        border-color: #48CAE466;
        background: linear-gradient(to bottom, transparent, rgba(72, 202, 228, 0.03));
      }
      .grain {
        position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 50;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
      }
      .active-nav-dot {
        width: 6px; height: 6px; background: #48CAE4; border-radius: 50%; display: inline-block;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="font-sans antialiased">
    <div class="grain"></div>
    <div class="orb orb-top-left"></div>
    <div class="orb orb-bottom-right"></div>
    
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Icon Loader
      const Icon = ({ name, size = 18, className = "" }) => {
        const [iconHtml, setIconHtml] = useState("");
        useEffect(() => {
          if (window.lucide) {
            const icon = window.lucide.icons[name];
            if (icon) setIconHtml(icon.toSvg({ width: size, height: size, class: className }));
          }
        }, [name, size, className]);
        return <span dangerouslySetInnerHTML={{ __html: iconHtml }} className="inline-block leading-none" />;
      };

      const TopHeader = () => (
        <div className="flex justify-between items-center py-6 px-10 border-b border-white/5 relative z-20">
          <div className="flex items-center gap-4">
            <div className="w-10 h-10 bg-gradient-to-br from-cyan-600 to-cyan-400 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-950/20">
              <span className="font-extrabold text-xl text-black">R</span>
            </div>
            <div className="text-xl tracking-tighter">
              <span className="font-extrabold text-white">Raman</span>
              <span className="text-gray-400 mx-1 font-light">AI|Labs</span>
            </div>
          </div>

          <div className="hidden lg:flex items-center gap-8 text-[11px] font-bold text-gray-500 uppercase tracking-widest">
            <div className="flex items-center gap-2">
              <Icon name="LayoutGrid" size={14} className="text-gray-600" />
              <span>Mo Us-40</span>
            </div>
            <div className="flex items-center gap-2">
              <span>Status: Active</span>
            </div>
            <div className="flex items-center gap-2">
              <span>Latency: Low</span>
            </div>
          </div>

          <button className="bg-cyan-500 hover:bg-cyan-400 text-black px-6 py-2 rounded-full text-xs font-black tracking-tight transition-all active:scale-95 shadow-lg shadow-cyan-500/20">
            Connect Me
          </button>
        </div>
      );

      const SubNav = () => (
        <nav className="flex items-center gap-12 px-10 py-6 relative z-20">
          <a href="#" className="flex items-center gap-2 text-white font-bold text-sm">
             <div className="w-5 h-5 rounded-full border border-cyan-400 flex items-center justify-center">
                <Icon name="ChevronRight" size={12} className="text-cyan-400" />
             </div>
             Projects
          </a>
          <a href="#" className="text-gray-400 hover:text-white text-sm font-medium transition-colors">Articles</a>
          <a href="#" className="text-gray-400 hover:text-white text-sm font-medium transition-colors">Research</a>
          <a href="#" className="text-cyan-400 font-bold text-sm">Blogs</a>
          <a href="#" className="text-gray-400 hover:text-white text-sm font-medium transition-colors">Archive</a>
        </nav>
      );

      const Sidebar = () => {
        const links = [
          { icon: 'MessageCircle', label: 'Chatbots', active: true },
          { icon: 'Cpu', label: 'Enterprise AI' },
          { icon: 'Zap', label: 'Neural Networks' },
          { icon: 'Facebook', label: 'Global Reach' },
          { icon: 'Linkedin', label: 'LinkedIn Pro' },
          { icon: 'ExternalLink', label: 'Resource Vault' },
          { icon: 'Anchor', label: 'Connect Me', footer: true },
        ];

        return (
          <div className="sidebar-panel w-full max-w-[300px] rounded-[24px] overflow-hidden">
            <div className="p-6 flex items-center gap-3 bg-white/5 border-b border-white/5">
              <div className="w-7 h-7 bg-cyan-500 rounded flex items-center justify-center text-[10px] text-black font-black">R</div>
              <span className="font-bold text-sm text-white">Raman <span className="text-gray-500 font-normal">AI|Labs</span></span>
            </div>
            
            <div className="py-2">
              {links.map((item, i) => (
                <div key={i}>
                  {!item.footer ? (
                    <a href="#" className={`flex items-center gap-4 px-6 py-4 text-[13px] transition-all ${item.active ? 'text-cyan-400 bg-cyan-400/5' : 'text-gray-400 hover:text-white hover:bg-white/5'}`}>
                      <Icon name={item.icon} size={16} className={item.active ? "text-cyan-400" : "text-gray-500"} />
                      <span className="font-medium tracking-tight">{item.label}</span>
                    </a>
                  ) : (
                    <div className="p-4 mt-2">
                       <button className="w-full flex items-center justify-center gap-3 py-3.5 bg-cyan-400/10 hover:bg-cyan-400/20 text-cyan-400 text-xs font-black rounded-xl border border-cyan-400/20 transition-all">
                         <Icon name="Anchor" size={16} />
                         CONNECT ME
                       </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      };

      const App = () => (
        <div className="min-h-screen flex flex-col">
          <TopHeader />
          <SubNav />
          
          <main className="flex-1 px-10 py-12 max-w-[1500px] w-full mx-auto flex flex-col lg:flex-row gap-20">
            {/* Left Section */}
            <div className="flex-1 space-y-24">
              <div className="max-w-2xl space-y-10">
                <h1 className="text-5xl md:text-6xl lg:text-[74px] font-semibold leading-[1.05] tracking-tighter text-gray-100">
                  Explore the deep oceanic depths of artificial intelligence across domains.
                </h1>
                <div className="flex gap-4">
                  <button className="px-10 py-3.5 bg-cyan-500 hover:bg-cyan-400 text-black font-black text-xs rounded-full shadow-lg shadow-cyan-500/20 transition-all active:scale-95">
                    Admin Toggle
                  </button>
                  <button className="px-10 py-3.5 border border-cyan-400 text-cyan-400 hover:bg-cyan-400/5 font-black text-xs rounded-full transition-all active:scale-95">
                    Connect Me
                  </button>
                </div>
              </div>

              {/* Project Grid - Vertical Dash Containers */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                <div className="dashed-box"></div>
                <div className="dashed-box"></div>
                <div className="dashed-box"></div>
              </div>
            </div>

            {/* Right Section - Floating Sidebar */}
            <div className="lg:w-[300px] shrink-0 pt-10">
              <Sidebar />
            </div>
          </main>

          {/* Large Watermark Background */}
          <div className="fixed bottom-0 right-0 opacity-[0.03] select-none pointer-events-none p-10 leading-none">
             <span className="text-[25vw] font-black tracking-tighter text-white">RAMAN</span>
          </div>
        </div>
      );

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
