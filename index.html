
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raman AI Labs | Global Research Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              obsidian: '#0A0C10',
              oceanic: '#48CAE4',
              tealAccent: '#00B4D8',
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0A0C10;
        color: white;
        margin: 0;
        overflow-x: hidden;
      }
      /* Large Oceanic Orbs from Reference */
      .orb-top {
        position: fixed; top: -15%; left: -5%; width: 50vw; height: 50vw;
        background: radial-gradient(circle, rgba(72, 202, 228, 0.15) 0%, rgba(10, 12, 16, 0) 70%);
        border-radius: 50%; filter: blur(100px); z-index: 0;
      }
      .orb-bottom {
        position: fixed; bottom: -20%; right: -10%; width: 60vw; height: 60vw;
        background: radial-gradient(circle, rgba(0, 180, 216, 0.12) 0%, rgba(10, 12, 16, 0) 70%);
        border-radius: 50%; filter: blur(120px); z-index: 0;
      }
      /* Glassmorphism Panel */
      .connect-panel {
        background: rgba(18, 22, 29, 0.7);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 32px 64px rgba(0, 0, 0, 0.6);
      }
      .nav-item {
        color: #9CA3AF;
        transition: all 0.3s ease;
        font-size: 0.95rem;
      }
      .nav-item:hover { color: white; }
      .nav-active { color: #48CAE4; font-weight: 600; }
      
      .content-placeholder {
        border: 1px dashed rgba(255, 255, 255, 0.15);
        height: 380px;
        border-radius: 12px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .content-placeholder:hover {
        border-color: rgba(72, 202, 228, 0.4);
        background: rgba(255, 255, 255, 0.02);
      }
      /* Grainy overlay for texture */
      .grainy {
        position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 50;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }
    </script>
  </head>
  <body class="font-sans antialiased overflow-x-hidden">
    <div class="grainy"></div>
    <div class="orb-top"></div>
    <div class="orb-bottom"></div>
    <div id="root"></div>
  </body>
</html>
