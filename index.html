<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raman AI Labs | Precision Interface</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0A0C10',
                        oceanic: '#48CAE4',
                        tealAccent: '#00B4D8',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0A0C10; color: white; overflow-x: hidden; }
        
        /* EXACT BACKGROUND SPHERES FROM IMAGE */
        .glow-sphere-top {
            position: fixed; top: -150px; left: 15%; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(72, 202, 228, 0.12) 0%, transparent 75%);
            filter: blur(80px); z-index: 0; pointer-events: none;
        }

        .glow-sphere-bottom {
            position: fixed; bottom: -200px; right: 20%; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 180, 216, 0.1) 0%, transparent 75%);
            filter: blur(100px); z-index: 0; pointer-events: none;
        }

        /* FLOATING SIDEBAR PANEL STYLING */
        .sidebar-panel {
            background: rgba(17, 20, 24, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 300px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .sidebar-link {
            display: flex; align-items: center; gap: 15px;
            padding: 14px 24px; font-size: 14px;
            color: #9CA3AF; transition: all 0.3s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .sidebar-link:hover { background: rgba(255, 255, 255, 0.04); color: white; }
        .sidebar-link i { color: #48CAE4; font-size: 16px; }

        /* HEADER NAV ACTIVE STATE */
        .nav-active { color: white; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .nav-inactive { color: #6B7280; }
        
        /* CONTENT BOXES */
        .project-card {
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px; height: 220px;
            background: rgba(255, 255, 255, 0.01);
            transition: border-color 0.3s;
        }
        .project-card:hover { border-color: #48CAE4; }

        /* BUTTONS */
        .btn-ocean { background: #48CAE4; color: #0A0C10; font-weight: 700; border-radius: 99px; }
        .btn-outline { border: 1px solid #374151; color: #D1D5DB; border-radius: 99px; }
    </style>
</head>
<body class="font-sans antialiased">

    <div class="glow-sphere-top"></div>
    <div class="glow-sphere-bottom"></div>

    <header class="relative z-20 px-10 py-10 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-[#0077B6] to-[#48CAE4] rounded-lg flex items-center justify-center shadow-lg shadow-oceanic/20">
                <span class="font-bold text-xl text-black">R</span>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Raman <span class="text-gray-500 font-normal">AI|</span>Labs</h1>
        </div>

        <nav class="hidden lg:flex items-center gap-10 text-sm">
            <a href="#" class="nav-active">
                <i class="fa-solid fa-circle-chevron-right text-oceanic"></i> Projects
            </a>
            <a href="#" class="nav-inactive hover:text-white">Articles</a>
            <a href="#" class="nav-inactive hover:text-white">Articles</a>
            <a href="#" class="text-oceanic font-bold">Blogs</a>
            <a href="#" class="nav-inactive hover:text-white">Blogs</a>
            <button class="bg-[#1B4332] text-white px-6 py-2 rounded-full text-xs font-bold ml-4">Connect Me</button>
        </nav>
    </header>

    <main class="relative z-10 px-10 pt-16 max-w-7xl mx-auto flex flex-col lg:flex-row gap-16">
        
        <div class="lg:w-2/3">
            <h2 class="text-5xl lg:text-6xl font-semibold leading-[1.15] mb-12 text-gray-100 max-w-3xl">
                Explore the deep oceanic depths of artificial intelligence across domains.
            </h2>
            
            <div class="flex gap-4 mb-24">
                <button class="btn-ocean px-8 py-3 text-sm hover:scale-105 transition-transform">Admin Toggle</button>
                <button class="btn-outline px-8 py-3 text-sm hover:bg-white/5 transition-colors">Connect Me</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="project-card"></div>
                <div class="project-card"></div>
                <div class="project-card"></div>
            </div>
        </div>

        <div class="lg:w-1/3 flex justify-center lg:justify-end items-start pt-10">
            <div class="sidebar-panel overflow-hidden">
                <div class="p-6 flex items-center gap-3 border-b border-white/5 bg-white/[0.02]">
                    <div class="w-6 h-6 bg-oceanic rounded flex items-center justify-center text-[10px] text-black font-extrabold">R</div>
                    <span class="font-bold text-xs tracking-widest text-gray-200 uppercase">Raman <span class="text-gray-500">AI|</span>Labs</span>
                </div>
                
                <div class="py-2">
                    <div class="sidebar-link text-oceanic font-bold bg-white/[0.03]">
                        <i class="fa-regular fa-comments"></i> Chatbots
                    </div>
                    <div class="sidebar-link">
                        <i class="fa-solid fa-bolt"></i> Chatbots
                    </div>
                    <div class="sidebar-link">
                        <i class="fa-regular fa-paper-plane"></i> LLM-Assistants
                    </div>
                    <div class="sidebar-link">
                        <i class="fa-brands fa-facebook-f"></i> Hover:bg-blue-600
                    </div>
                    <div class="sidebar-link">
                        <i class="fa-brands fa-linkedin-in"></i> Hover:bg-blue-600
                    </div>
                    <div class="sidebar-link">
                        <i class="fa-solid fa-link"></i> LinkedIn
                    </div>
                    <a href="mailto:nikhilraman1203@gmail.com" class="flex items-center gap-3 px-6 py-5 bg-oceanic/10 text-oceanic font-bold text-sm border-t border-white/5 hover:bg-oceanic/20 transition-all">
                        <i class="fa-solid fa-anchor"></i> Connect Me
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div class="fixed bottom-[-30px] left-10 opacity-[0.02] pointer-events-none select-none z-0">
        <h3 class="text-[200px] font-black tracking-tighter uppercase leading-none">RAMAN</h3>
    </div>

</body>
</html>
