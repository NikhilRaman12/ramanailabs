<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raman AI Labs | Digital Ecosystem</title>
    
    <!-- SYSTEM FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- GLOBAL CDN STACK (Reliable & Fast) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- LUCIDE ICONS (Fixed Import) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- DESIGN SYSTEM CONFIG -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        obsidian: '#050505',
                        charcoal: '#0F0F0F',
                        ocean: '#0077B6',
                        oceanLight: '#00B4D8',
                        glass: 'rgba(255, 255, 255, 0.03)'
                    },
                    backgroundImage: {
                        'glow': 'radial-gradient(circle at center, rgba(0, 180, 216, 0.15) 0%, rgba(5, 5, 5, 0) 70%)',
                        'card-gradient': 'linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%)'
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #050505; 
            color: #ffffff; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Glassmorphism Engine */
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Scrollbar aesthetics */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00B4D8; }

        /* Smooth Anchor Scrolling */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <!-- REACT ROOT -->
    <div id="root"></div>

    <!-- REACT APPLICATION LOGIC -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- ICON COMPONENT WRAPPER ---
        const Icon = ({ name, size = 20, className }) => {
            const LucideIcons = window.lucide ? window.lucide.icons : {};
            const IconComponent = LucideIcons[name];
            return IconComponent ? <IconComponent size={size} className={className} /> : null;
        };

        // --- CONTENT MANAGEMENT SYSTEM (CMS) ---
        const LAB_DATA = {
            experiments: [
                { id: 1, title: "Neural Architecture Search", tag: "AI/ML", desc: "Automating network design using reinforcement learning agents." },
                { id: 2, title: "Bio-Synthetic Rendering", tag: "Lifesciences", desc: "Real-time visualization of protein folding sequences." },
                { id: 3, title: "Agri-Drone Vision", tag: "Agriculture", desc: "Computer vision models for crop health monitoring." }
            ],
            articles: [
                { id: 1, title: "The Ethics of Predictive Analytics", date: "Dec 2024", readTime: "8 min read" },
                { id: 2, title: "Scaling React for Enterprise", date: "Nov 2024", readTime: "12 min read" }
            ],
            blogs: [
                { id: 1, title: "Why I chose Obsidian UI", date: "Today" },
                { id: 2, title: "The Future of Ag-Tech in India", date: "Last Week" }
            ]
        };

        const PILLARS = [
            { id: 'data', title: 'Data', sub: 'Analytics & ML', icon: 'Database', color: 'text-blue-400' },
            { id: 'tech', title: 'Tech', sub: 'Engineering', icon: 'Cpu', color: 'text-indigo-400' },
            { id: 'life', title: 'Lifesciences', sub: 'Bio & Agri', icon: 'Dna', color: 'text-emerald-400' },
            { id: 'arts', title: 'Fine Arts', sub: 'Design & Craft', icon: 'Palette', color: 'text-rose-400' }
        ];

        // --- COMPONENTS ---

        const Navbar = () => (
            <nav className="fixed top-0 w-full z-50 glass-panel border-b border-white/5">
                <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                    <div className="flex items-center gap-3 group cursor-pointer">
                        <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-oceanLight to-blue-700 flex items-center justify-center shadow-[0_0_15px_rgba(0,180,216,0.2)]">
                            <span className="font-bold text-white text-xl">R</span>
                        </div>
                        <div className="flex flex-col">
                            <span className="font-bold text-white leading-none">Raman AI Labs</span>
                            <span className="text-[10px] tracking-widest text-oceanLight font-mono mt-1">EST. 2025</span>
                        </div>
                    </div>
                    <div className="hidden md:flex items-center gap-8 text-sm font-medium text-gray-400">
                        <a href="#domains" className="hover:text-white transition-colors">Domains</a>
                        <a href="#lab" className="hover:text-white transition-colors">Laboratory</a>
                        <a href="#contact" className="px-5 py-2 rounded-full border border-white/10 hover:bg-white/5 hover:border-oceanLight/50 hover:text-white transition-all">
                            Connect
                        </a>
                    </div>
                </div>
            </nav>
        );

        const Hero = () => (
            <section className="relative min-h-screen flex items-center justify-center pt-20 px-6">
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-glow opacity-40 pointer-events-none" />
                
                <motion.div 
                    initial={{ opacity: 0, y: 30 }} 
                    animate={{ opacity: 1, y: 0 }} 
                    transition={{ duration: 0.8 }}
                    className="relative z-10 text-center max-w-4xl mx-auto"
                >
                    <div className="flex justify-center mb-8">
                        <div className="px-4 py-1.5 rounded-full border border-oceanLight/20 bg-oceanLight/5 text-oceanLight text-xs font-mono flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-oceanLight animate-pulse"></span>
                            SYSTEM ONLINE • INDIA
                        </div>
                    </div>
                    <h1 className="text-5xl md:text-8xl font-bold tracking-tight mb-8 leading-[1.1]">
                        Architecting <br/>
                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-300 to-gray-600">
                            Intelligence.
                        </span>
                    </h1>
                    <p className="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto leading-relaxed mb-10">
                        A convergence of Data Science, Full-Stack Engineering, Lifesciences, and Digital Artistry.
                    </p>
                    <div className="flex flex-col md:flex-row items-center justify-center gap-4">
                        <a href="#contact" className="w-full md:w-auto px-8 py-4 bg-oceanLight text-black font-bold rounded-xl hover:bg-white hover:scale-105 transition-all shadow-[0_0_20px_rgba(0,180,216,0.3)]">
                            Collaborate
                        </a>
                        <a href="#lab" className="w-full md:w-auto px-8 py-4 glass-panel text-white font-medium rounded-xl hover:bg-white/10 transition-all">
                            View Research
                        </a>
                    </div>
                </motion.div>
            </section>
        );

        const Domains = () => (
            <section id="domains" className="py-24 px-6 border-t border-white/5 bg-[#080808]">
                <div className="max-w-7xl mx-auto">
                    <h2 className="text-3xl font-bold mb-12">Core Architecture</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {PILLARS.map((p, i) => (
                            <motion.div 
                                key={p.id}
                                initial={{ opacity: 0, y: 20 }}
                                whileInView={{ opacity: 1, y: 0 }}
                                transition={{ delay: i * 0.1 }}
                                className="glass-panel p-8 rounded-2xl hover:border-oceanLight/30 transition-all group"
                            >
                                <div className={`mb-6 p-4 w-fit rounded-xl bg-white/5 ${p.color}`}>
                                    <Icon name={p.icon} size={24} />
                                </div>
                                <h3 className="text-xl font-bold mb-2">{p.title}</h3>
                                <p className="text-sm text-gray-500">{p.sub}</p>
                            </motion.div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Lab = () => {
            const [tab, setTab] = useState('experiments');
            return (
                <section id="lab" className="py-24 px-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                            <div>
                                <h2 className="text-3xl font-bold mb-2 flex items-center gap-3">
                                    <Icon name="FlaskConical" className="text-oceanLight" />
                                    The Laboratory
                                </h2>
                                <p className="text-gray-500">Active R&D and Documentation.</p>
                            </div>
                            <div className="flex bg-white/5 p-1 rounded-lg">
                                {['experiments', 'articles', 'blogs'].map(t => (
                                    <button 
                                        key={t}
                                        onClick={() => setTab(t)}
                                        className={`px-4 py-2 text-sm font-medium rounded-md capitalize transition-all ${tab === t ? 'bg-white/10 text-white' : 'text-gray-500'}`}
                                    >
                                        {t}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {tab === 'experiments' && LAB_DATA.experiments.map(item => (
                                <div key={item.id} className="glass-panel p-8 rounded-2xl hover:bg-white/5 transition-all group cursor-pointer border-transparent hover:border-oceanLight/20">
                                    <div className="flex justify-between items-start mb-4">
                                        <span className="text-xs font-mono text-oceanLight border border-oceanLight/20 px-2 py-1 rounded bg-oceanLight/5">{item.tag}</span>
                                        <Icon name="ArrowUpRight" className="text-gray-600 group-hover:text-white" />
                                    </div>
                                    <h3 className="text-xl font-bold mb-2">{item.title}</h3>
                                    <p className="text-gray-400 text-sm">{item.desc}</p>
                                </div>
                            ))}
                            {tab === 'articles' && LAB_DATA.articles.map(item => (
                                <div key={item.id} className="glass-panel p-8 rounded-2xl border-l-4 border-l-transparent hover:border-l-oceanLight transition-all">
                                    <h3 className="text-xl font-bold mb-2">{item.title}</h3>
                                    <p className="text-xs text-gray-500 font-mono">{item.date} • {item.readTime}</p>
                                </div>
                            ))}
                             {tab === 'blogs' && LAB_DATA.blogs.map(item => (
                                <div key={item.id} className="p-8 rounded-2xl border border-white/10 hover:border-white/30 transition-all">
                                    <h3 className="text-lg font-medium italic text-gray-300">"{item.title}"</h3>
                                    <p className="text-xs text-oceanLight font-mono mt-4">{item.date}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer id="contact" className="py-24 px-6 border-t border-white/10 relative overflow-hidden bg-gradient-to-b from-obsidian to-black">
                <div className="max-w-4xl mx-auto text-center relative z-10">
                    <h2 className="text-4xl md:text-5xl font-bold mb-8">Let's collaborate.</h2>
                    <div className="flex flex-col md:flex-row items-center justify-center gap-4 mb-16">
                        <a href="https://wa.me/9110343178" className="w-full md:w-auto px-6 py-3 bg-[#25D366] text-black font-bold rounded-lg hover:opacity-90 flex items-center justify-center gap-2">
                            <Icon name="MessageCircle" size={18} /> WhatsApp
                        </a>
                        <a href="mailto:nikhilraman1203@gmail.com" className="w-full md:w-auto px-6 py-3 bg-white text-black font-bold rounded-lg hover:bg-gray-200 flex items-center justify-center gap-2">
                            <Icon name="Mail" size={18} /> Email Me
                        </a>
                        <a href="https://www.linkedin.com/in/nikhil-raman-k-448589201/" className="w-full md:w-auto px-6 py-3 bg-[#0077B5] text-white font-bold rounded-lg hover:opacity-90 flex items-center justify-center gap-2">
                            <Icon name="Linkedin" size={18} /> LinkedIn
                        </a>
                    </div>
                    <p className="text-xs text-gray-600 font-mono">© 2025 Raman AI Labs. All Systems Nominal.</p>
                </div>
            </footer>
        );

        const App = () => (
            <div className="antialiased pb-10">
                <Navbar />
                <Hero />
                <Domains />
                <Lab />
                <Footer />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
